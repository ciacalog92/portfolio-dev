name = "portfolio-dev"
compatibility_date = "2026-05-22"

# Build the Vite output before every `wrangler deploy` (so dist/ always exists,
# even when the platform runs the deploy command without a separate build step).
[build]
command = "npm run build"

# Static-assets-only Worker: `wrangler deploy` uploads the built Vite output.
# Unknown paths fall back to index.html via native SPA handling (Workers
# Assets rejects a `/* -> /index.html 200` _redirects rule as a loop).
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
